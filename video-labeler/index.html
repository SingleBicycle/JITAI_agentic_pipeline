<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Labeler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel import-panel">
        <h1>Video Labeler</h1>
        <textarea id="link-input" placeholder="Paste one or many links"></textarea>
        <div class="row">
          <button id="import-text-button">Import Links</button>
          <input id="file-input" type="file" accept=".txt,.csv">
        </div>
        <p id="import-report"></p>
      </section>

      <section class="panel session-panel">
        <button id="choose-folder-button">Choose Output Folder</button>
        <p id="save-status">No folder selected</p>
      </section>

      <section class="panel queue-panel">
        <ul id="queue-list"></ul>
      </section>

      <section class="panel player-panel">
        <div id="player-status">No video selected</div>
        <video id="video-element" controls></video>
        <div id="youtube-host"></div>
        <div class="transport-row">
          <button id="previous-button">Previous</button>
          <button id="next-button">Next</button>
        </div>
        <section class="interaction-editor" aria-labelledby="interaction-editor-heading">
          <div class="section-heading-row">
            <h2 id="interaction-editor-heading">Interaction Episode</h2>
            <button id="erase-interaction-button" type="button">Erase Latest Episode</button>
          </div>
          <div class="time-grid">
            <label>
              Cue Start
              <span class="time-control">
                <input id="cue-start-input" inputmode="decimal" placeholder="0.00">
                <button type="button" data-time-target="cue-start-input">Set</button>
              </span>
            </label>
            <label>
              Cue End
              <span class="time-control">
                <input id="cue-end-input" inputmode="decimal" placeholder="0.00">
                <button type="button" data-time-target="cue-end-input">Set</button>
              </span>
            </label>
            <label>
              Response Start
              <span class="time-control">
                <input id="response-start-input" inputmode="decimal" placeholder="0.00">
                <button type="button" data-time-target="response-start-input">Set</button>
              </span>
            </label>
            <label>
              Response End
              <span class="time-control">
                <input id="response-end-input" inputmode="decimal" placeholder="0.00">
                <button type="button" data-time-target="response-end-input">Set</button>
              </span>
            </label>
          </div>
          <div class="interaction-grid">
            <label>
              Cue Actor
              <input id="cue-actor-input" placeholder="P1">
            </label>
            <label>
              Candidate Recipient
              <input id="candidate-recipient-input" placeholder="P2">
            </label>
            <label>
              Cue Type
              <select id="cue-type-select"></select>
            </label>
            <label>
              Recipient Access
              <select id="access-label-select"></select>
            </label>
            <label>
              Response/No-Response Event
              <select id="response-label-select"></select>
            </label>
            <label>
              Response Type
              <select id="response-type-select"></select>
            </label>
            <label>
              Cue-Response Link
              <select id="cue-response-link-select"></select>
            </label>
            <label>
              Ambiguity
              <select id="ambiguity-label-select"></select>
            </label>
          </div>
          <label class="evidence-label">
            Evidence Spans
            <textarea id="evidence-spans-input" placeholder="13.20-14.80; 15.10-17.00"></textarea>
          </label>
          <label class="evidence-label">
            Optional Description
            <textarea id="episode-description-input" placeholder="Observable note for this episode"></textarea>
          </label>
          <div class="row">
            <button id="use-cue-response-evidence-button" type="button">Use Cue/Response Spans</button>
            <button id="save-interaction-button" type="button">Save Episode</button>
          </div>
        </section>
        <section class="history-panel">
          <div class="history-group interaction-history">
            <h2>Interaction Episodes</h2>
            <ul id="interaction-episodes-list"></ul>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
