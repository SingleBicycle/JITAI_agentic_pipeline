<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Labeler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel import-panel">
        <p class="eyebrow">Editorial Slate</p>
        <h1>Video Labeler</h1>
        <textarea id="link-input" placeholder="Paste one or many links"></textarea>
        <div class="row">
          <button id="import-text-button">Import Links</button>
          <input id="file-input" type="file" accept=".txt,.csv">
        </div>
        <p id="import-report"></p>
      </section>

      <section class="panel session-panel">
        <button id="choose-folder-button">Choose Output Folder</button>
        <p id="save-status">No folder selected</p>
      </section>

      <section class="panel queue-panel">
        <ul id="queue-list"></ul>
      </section>

      <section class="panel player-panel">
        <div id="player-status">No video selected</div>
        <video id="video-element" controls></video>
        <div id="youtube-host"></div>
        <div class="transport-row">
          <button id="previous-button">Previous</button>
          <button id="next-button">Next</button>
        </div>
        <div class="label-toolbar">
          <button id="capture-marker-button">mark</button>
          <div id="marker-actions" class="marker-actions"></div>
        </div>
        <div class="clip-description-row">
          <input id="clip-description-input" placeholder="Describe the latest completed clip">
          <button id="apply-description-button">Apply Description</button>
        </div>
        <section class="history-panel">
          <div class="history-group">
            <h2>Markers</h2>
            <ul id="markers-list"></ul>
          </div>
          <div class="history-group">
            <h2>Clips</h2>
            <ul id="clips-list"></ul>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
